# web/ 폴더를 GitHub Pages 로 올린다.
#
# 주소 : https://chcbaram.github.io/nu54v-dk/
#
# 저장소 설정에서 Settings > Pages > Source 를 "GitHub Actions" 로 한 번 바꿔야 한다.
# WebUSB / Web Bluetooth / Web Serial 은 HTTPS 에서만 동작하므로 Pages 가 맞다.

name: Deploy web tool to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:        # 손으로도 돌릴 수 있다

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # js 태그의 ?v= 를 갱신한다. 안 하면 브라우저가 예전 js 를 계속 쓴다.
      - name: 캐시 버스터 갱신
        run: python3 web/bump_version.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
