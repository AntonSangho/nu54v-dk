# BLE 스택 공통 (_USE_HW_BLE)
#
# 역할과 서비스는 각각의 조각 파일에서 켠다. 프로젝트 CMakeLists 의 EXTRA_CONF_FILE 로 붙인다.

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="NU54V-DK"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# 본드 저장 (nvs 예제의 Settings + ZMS 위에 올라간다)
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 처리량 : MTU 247 + Data Length Extension + 2M PHY
# (23 바이트 MTU 면 부팅 로그·help 출력에서 패킷 수가 10배가 된다 — baram-term 쪽 의견)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_CLIENT=n

# 송신 버퍼. 기본 3 개면 한 연결 이벤트에 3 패킷까지만 실어 보낸다.
# ble_nus 는 MTU 만큼 모아 보내므로 6 개면 6*244 = 1.4 KB 가 흐를 수 있다.
# (버퍼 하나당 RAM 약 260 바이트)
CONFIG_BT_BUF_ACL_TX_COUNT=6

# ble info 에서 협상된 PHY / 데이터 길이를 보려면 필요하다
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
