# 주변기기 역할 (_USE_HW_BLE_PERIPHERAL)
#
# 중앙 역할(ble_central.conf)을 같이 붙이면 컨트롤러가 multirole 로 잡힌다.

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_LL_SOFTDEVICE_PERIPHERAL=y

# 연결 간격 : 타이핑 왕복이 간격의 2배라 활성 15~30 ms 가 자연스럽다.
# 대기 중 간격을 늘리는 것(저전력)은 로드맵 17 ble_power 에서 한다.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
