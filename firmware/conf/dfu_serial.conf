# SMP over 시리얼 — cli 가 쓰는 포트(VCOM1) 위에 직접 얹는다 (_USE_HW_DFU_SERIAL)
#
# Zephyr 의 MCUMGR_TRANSPORT_UART 를 쓰지 않는다. 그것은
#   - 전용 포트(zephyr,uart-mcumgr)를 따로 잡고
#   - UART_INTERRUPT_DRIVEN 을 select 해서 cli 포트까지 async 가 아니게 만든다
# 이 보드에서는 VCOM0 를 쓰면 내장 프로브의 SWD 가 죽는 문제도 있다
# (docs/reports/2026-09-20_daplink_vcom0_swd.md).
#
# 전송 계층만 hw/driver/dfu/dfu_serial.c 에서 만든다. 프레이밍은 표준이라
# mcumgr CLI / smpclient 가 그대로 붙는다.

CONFIG_NU54_DFU_SMP_UART=y        # 프레이밍 헬퍼(serial_util.c)를 빌드에 넣는다
CONFIG_BASE64=y
