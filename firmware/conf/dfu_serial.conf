# SMP over 시리얼 (_USE_HW_DFU_SERIAL)
#
# VCOM0(uart30)에 얹는다. cli/log 는 VCOM1(uart20)을 그대로 쓰므로 서로 간섭하지 않는다.
# 어느 포트를 쓸지는 프로젝트 app.overlay 의 chosen zephyr,uart-mcumgr 로 정한다.
#
# 프레이밍은 표준 SMP 시리얼 (0x06 0x09 마커 + base64 + CRC16). mcumgr CLI 와 그대로 통한다.
# (raw 전송 CONFIG_MCUMGR_TRANSPORT_RAW_UART 도 있지만 표준 도구와 안 맞는다)

CONFIG_BASE64=y
CONFIG_UART_MCUMGR=y              # UART_INTERRUPT_DRIVEN 을 select 한다 (uart20 은 async 그대로)
CONFIG_MCUMGR_TRANSPORT_UART=y

# 한 프레임 크기. 업로드 청크가 여기에 맞춰진다.
CONFIG_UART_MCUMGR_RX_BUF_SIZE=512
CONFIG_UART_MCUMGR_RX_BUF_COUNT=2

# 포트별로 어떤 API 를 쓸지 명시한다. 이것이 없으면 부팅하자마자 죽는다.
#
# UART_MCUMGR 이 UART_INTERRUPT_DRIVEN 을 select 하는데, 인스턴스별 기본값이
# UART_<n>_INTERRUPT_DRIVEN=y 이고 UART_<n>_ASYNC 는 !UART_<n>_INTERRUPT_DRIVEN 에 달려 있다.
# 그래서 cli 가 쓰는 uart20 까지 인터럽트 방식으로 넘어가 async API(rx_enable)가 NULL 이 되고,
# uartRxStart() 에서 PC=0 으로 점프한다 (USAGE FAULT). docs/18_dfu.md §4 함정 6
CONFIG_UART_20_INTERRUPT_DRIVEN=n     # VCOM1 : cli/log — 우리 uart 모듈이 async(DMA) 로 쓴다
CONFIG_UART_30_INTERRUPT_DRIVEN=y     # VCOM0 : SMP — uart_mcumgr 가 인터럽트 방식으로 쓴다
