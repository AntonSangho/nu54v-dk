# DFU 공통 — MCUmgr(SMP) + MCUboot 이미지 관리 (_USE_HW_DFU)
#
# 전송 경로는 dfu_ble.conf / dfu_serial.conf 에서 따로 켠다.
# NCS 샘플의 CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU 한 줄 대신 표준 심볼을 직접 켠다
# (그 심볼은 nrf/samples/common 아래에만 있어서 일반 앱에서 쓰기 어렵다).

CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y

# RRAM 접근 + 이미지 관리
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y      # boot_write_img_confirmed() 등 (dfu CLI 에서 사용)

# 명령 그룹
CONFIG_MCUMGR_GRP_IMG=y           # 이미지 목록/업로드/test/confirm/erase
CONFIG_MCUMGR_GRP_OS=y            # reset, echo
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# 업로드 처리는 워크큐에서 돈다. 기본값이면 스택이 모자란다.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
