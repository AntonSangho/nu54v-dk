# SMP over BLE (_USE_HW_DFU_BLE)
#
# NUS(cli)와 같은 연결 위에 SMP 서비스가 함께 올라간다.
# SMP Service UUID : 8D53DC1D-1DB7-4CD3-868B-8A527460AA84

CONFIG_MCUMGR_TRANSPORT_BT=y

# 업로드 중에만 연결 간격을 당긴다 (끝나면 스택이 되돌린다). ble.conf 의 `ble fast` 와 같은 성격.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# SMP 패킷이 MTU 보다 크므로 여러 write 로 나눠 받아 다시 붙인다.
# 버퍼 크기는 MTU 247 기준 권장값 (MTU 498 을 쓰면 2475).
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1230
