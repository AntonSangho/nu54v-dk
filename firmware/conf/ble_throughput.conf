# 고속 송수신이 필요할 때 붙이는 조각 (선택)
#
#   set(EXTRA_CONF_FILE ... ${CONF_DIR}/ble_throughput.conf)
#
# 기본값(ble.conf)은 저전력 쪽에 맞춰 두었다. 여기 값은 RAM 과 전류를 더 쓰는 대신 속도를 올린다.
# 런타임으로는 `ble fast on` 으로 2M PHY + 짧은 인터벌을 요청한다 (ble.c).
#
# 참고 : 링크 자체의 최대치는 2M PHY + MTU 247 + DLE 251 + 7.5 ms 인터벌에서
#        대략 700~1000 kbps 다. CLI 텍스트 정도면 기본값으로도 충분하다.

# 호스트 스택 송신 버퍼. 한 연결 이벤트에 실어 보낼 수 있는 패킷 수를 늘린다.
# (버퍼 하나당 RAM 약 260 바이트)
CONFIG_BT_BUF_ACL_TX_COUNT=10

# 링크 레이어 버퍼. 앱이 연결 이벤트 중에 버퍼를 채우지 못할 만큼 바쁠 때만 올린다.
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=8
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=4

# 한 연결 이벤트에 쓸 수 있는 시간. 길수록 이벤트당 패킷이 많아진다 (기본 7500 us).
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=15000
