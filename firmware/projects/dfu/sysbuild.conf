# MCUboot 부트로더를 켠다 (18 dfu)
#
# 모드는 NCS 의 nRF54L 기본값인 swap using move 를 그대로 쓴다.
#   - 새 이미지를 slot1 에 올리고 test 로 표시 → 리셋 → 부팅 성공 후 confirm 해야 확정
#   - confirm 하지 않으면 다음 부팅에 이전 버전으로 되돌아간다
# 서명은 ED25519 + SHA512 (nRF54L 기본). 키 경로는 fw 스크립트가 절대 경로로 넘긴다
# (firmware/keys/nu54v_dk_ed25519.pem — 앱과 MCUboot 가 상대 경로를 다르게 풀기 때문).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
