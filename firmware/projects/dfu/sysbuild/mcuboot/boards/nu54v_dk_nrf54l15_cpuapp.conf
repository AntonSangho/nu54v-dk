# NU54-DK 의 MCUboot 이미지 설정
#
# nrf/samples/dfu/smp_svr/sysbuild/mcuboot/boards/nrf54l15dk_nrf54l15_cpuapp.conf 를 따른다.

# MCUboot 는 스택을 많이 쓴다. 작으면 MPU fault 가 난다.
CONFIG_MAIN_STACK_SIZE=16384

# RRAM 접근
CONFIG_FLASH=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y
CONFIG_MULTITHREADING=y

# 크기 줄이기 (boot_partition 62 KB 안에 들어가야 한다)
CONFIG_CBPRINTF_NANO=y
CONFIG_MINIMAL_LIBC=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# 부트로더 영역 쓰기 보호. 크기가 모자라면 n 으로 (샘플은 n).
CONFIG_FPROTECT=y

CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"
