CONFIG_GPIO=y

# UART (cli) : uart 모듈에서 async(DMA) API 로 직접 처리
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=n

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096

# 저전력 : 사용하지 않는 주변장치(UART)는 자동 suspend
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# 디버깅 편의 (-Og, 스레드 정보) - 소비전류 측정/양산 시에는 끈다
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# 모듈 스레드 정보 (module thread : 이름, 스택 사용량)
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# 리셋 사유 / System OFF
CONFIG_HWINFO=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y

# ADC (VBAT) / 칩 온도
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# 설정 저장 (Settings + ZMS, storage_partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# 날짜/시계 : 기준 시각을 보존 RAM 에 둔다 (리셋·System OFF 에도 유지)
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_RAM_CTRL=y
